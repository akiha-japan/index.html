<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKIHA JAPAN - 宇宙インベーダーゲーム</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    h1 { margin-top: 20px; font-size: 1.5rem; color: #00ff00; }
    #score-board { font-size: 1.2rem; margin-bottom: 10px; }
    #gameCanvas {
      background: #000;
      border: 4px solid #333;
      display: block;
      margin: 0 auto;
      max-width: 100%;
    }
    /* スマホ用コントローラー */
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
    }
    .btn {
      width: 70px;
      height: 60px;
      background: #333;
      border: 2px solid #555;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      touch-action: manipulation;
    }
    .btn:active { background: #555; }
    #btn-fire { background: #cc0000; border-color: #ff3333; width: 100px; }
    #btn-fire:active { background: #ff0000; }
    .info { color: #888; font-size: 0.85rem; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>🚀 AKIHA JAPAN : SPACE INVADERS</h1>
  <div id="score-board">SCORE: <span id="score">0</span></div>

  <!-- ゲーム画面 -->
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <!-- スマホ用ボタン（PCのキーボードでも動きます） -->
  <div class="controls">
    <button class="btn" id="btn-left">◀</button>
    <button class="btn" id="btn-fire">FIRE</button>
    <button class="btn" id="btn-right">▶</button>
  </div>

  <p class="info">PC操作: 左右矢印キー [←][→] で移動 / [スペースキー] で攻撃</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    let score = 0;
    let gameOver = false;

    // 自機（プレイヤー）
    const player = { x: 180, y: 360, width: 30, height: 20, speed: 5 };

    // 弾の配列
    let bullets = [];
    // インベーダーの配列
    let invaders = [];

    // インベーダーの初期配置
    const rows = 3;
    const cols = 6;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        invaders.push({
          x: 40 + c * 50,
          y: 40 + r * 35,
          width: 25,
          height: 20,
          alive: true
        });
      }
    }

    let invaderSpeed = 0.5;
    let invaderDirection = 1; // 1: 右, -1: 左

    // キーボード入力の状態
    let rightPressed = false;
    let leftPressed = false;

    // イベントリスナー（PCキーボード）
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") rightPressed = true;
      if (e.key === "ArrowLeft") leftPressed = true;
      if (e.key === " " || e.key === "Spacebar") {
        fireBullet();
        e.preventDefault(); // スペースキーでの画面スクロールを防止
      }
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowRight") rightPressed = false;
      if (e.key === "ArrowLeft") leftPressed = false;
    });

    // タッチボタンのイベント（スマホ用）
    document.getElementById("btn-left").addEventListener("pointerdown", () => leftPressed = true);
    document.getElementById("btn-left").addEventListener("pointerup", () => leftPressed = false);
    document.getElementById("btn-right").addEventListener("pointerdown", () => rightPressed = true);
    document.getElementById("btn-right").addEventListener("pointerup", () => rightPressed = false);
    document.getElementById("btn-fire").addEventListener("pointerdown", fireBullet);

    function fireBullet() {
      if (gameOver) return;
      // 画面上の弾が3発未満のときだけ撃てる（連射制限）
      if (bullets.length < 3) {
        bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10, speed: 7 });
      }
    }

    // メインのゲームループ
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      } else {
        ctx.fillStyle = "red";
        ctx.font = "30px sans-serif";
        ctx.fillText("GAME OVER", 110, 200);
        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText("リロードして再挑戦", 140, 240);
      }
    }

    // 状態の更新
    function update() {
      // プレイヤーの移動
      if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;
      if (leftPressed && player.x > 0) player.x -= player.speed;

      // 弾の移動
      bullets.forEach((b, index) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(index, 1); // 画面外に出たら消去
      });

      // インベーダーの移動
      let shiftDown = false;
      invaders.forEach(inv => {
        if (!inv.alive) return;
        inv.x += invaderSpeed * invaderDirection;
        // 壁にぶつかったら折り返すフラグを立てる
        if (inv.x > canvas.width - inv.width || inv.x < 0) {
          shiftDown = true;
        }
        // 自機の位置まで侵略されたらゲームオーバー
        if (inv.y + inv.height >= player.y) {
          gameOver = true;
        }
      });

      if (shiftDown) {
        invaderDirection *= -1;
        invaders.forEach(inv => { if (inv.alive) inv.y += 15; }); // 一歩前進
      }

      // 当たり判定（弾 と インベーダー）
      bullets.forEach((b, bIdx) => {
        invaders.forEach((inv) => {
          if (inv.alive && b.x > inv.x && b.x < inv.x + inv.width && b.y > inv.y && b.y < inv.y + inv.height) {
            inv.alive = false;     // インベーダー死亡
            bullets.splice(bIdx, 1); // 弾消滅
            score += 10;
            scoreEl.textContent = score;
            
            // 全滅チェック
            if (invaders.every(i => !i.alive)) {
              gameOver = true; // クリアだけど簡易的に終了
            }
          }
        });
      });
    }

    // 描画処理
    function draw() {
      // プレイヤー（緑のロケット型）
      ctx.fillStyle = "#00ff00";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // 弾（黄色）
      ctx.fillStyle = "#ffff00";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      // インベーダー（白のドット）
      ctx.fillStyle = "#ffffff";
      invaders.forEach(inv => {
        if (inv.alive) {
          ctx.fillRect(inv.x, inv.y, inv.width, inv.height);
          // 簡易的な目の描写
          ctx.clearRect(inv.x + 4, inv.y + 4, 3, 3);
          ctx.clearRect(inv.x + 18, inv.y + 4, 3, 3);
        }
      });
    }

    // ゲーム開始
    gameLoop();
  </script>
</body>
</html>

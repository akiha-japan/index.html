<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🚀 SPACE HONGDARS: ULTIMATE</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
    h1 { margin: 10px 0; font-size: 1.2rem; color: #00ff00; }
    .status { display: flex; justify-content: center; gap: 20px; font-weight: bold; margin-bottom: 5px; }
    #gameCanvas { background: #000; border: 2px solid #555; display: block; margin: 0 auto; }
    .instructions { color: #888; font-size: 0.8rem; margin: 10px; }
    .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
    .btn { width: 60px; height: 50px; background: #333; color: #fff; border: 1px solid #777; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>SPACE HONGDARS : ULTIMATE</h1>
  <div class="status">
    <div>STAGE: <span id="stage">1</span></div>
    <div>SCORE: <span id="score">0</span></div>
    <div>残り: <span id="ammo">100</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="instructions">移動: ◀ ▶ / 攻撃: [Space]</div>
  <div class="btn-group">
    <button class="btn" onclick="move(-5)">◀</button>
    <button class="btn" onclick="fire()" style="background:#800">FIRE</button>
    <button class="btn" onclick="move(5)">▶</button>
  </div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // ゲーム状態
  let score = 0, ammo = 100, stage = 1, gameOver = false;
  let player = { x: 180, y: 360, width: 30, height: 20, mode: 'single' };
  let bullets = [], invaders = [], particles = [], stars = [], enemyBullets = [], ufo = null, powerup = null;

  // 効果音
  function playSound(freq, type, dur) {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  }

  // 初期化
  function initLevel() {
    invaders = [];
    for(let r=0; r<3; r++) {
      for(let c=0; c<6; c++) {
        invaders.push({x: 40+c*50, y: 40+r*40, type: r===0?'tako':r===1?'ari':'bike', alive:true});
      }
    }
  }

  // 星の生成
  for(let i=0; i<50; i++) stars.push({x:Math.random()*400, y:Math.random()*400, s:Math.random()*2});

  function move(d) { player.x = Math.max(0, Math.min(370, player.x + d)); }
  function fire() {
    if (ammo > 0) {
      if(player.mode === 'wide') {
        [-10, 0, 10].forEach(off => bullets.push({x:player.x+15+off, y:player.y, vx:off/5}));
      } else {
        bullets.push({x:player.x+15, y:player.y, vx:0});
      }
      ammo--;
      document.getElementById('ammo').textContent = ammo;
      playSound(200, 'square', 0.1);
    }
  }

  function update() {
    if(gameOver) return;
    // 星移動
    stars.forEach(st => { st.y += st.s; if(st.y > 400) st.y = 0; });
    // UFO
    if(!ufo && Math.random() < 0.005) ufo = {x:-30, y:20, active:true};
    if(ufo) { ufo.x += 2; if(ufo.x > 430) ufo = null; }
    // 敵移動と反撃
    invaders.forEach(inv => {
      inv.x += (0.5 + stage*0.2) * (Math.sin(Date.now()/500) > 0 ? 1 : -1);
      if(Math.random() < 0.001 * stage) enemyBullets.push({x:inv.x, y:inv.y});
    });
    // 弾と当たり判定
    bullets.forEach((b, i) => {
      b.y -= 5; b.x += b.vx;
      if(b.y < 0) bullets.splice(i,1);
      // 敵判定
      invaders.forEach(inv => {
        if(inv.alive && b.x > inv.x && b.x < inv.x+30 && b.y > inv.y && b.y < inv.y+20) {
          inv.alive = false; score += (inv.type==='tako'?30:inv.type==='ari'?20:10);
          for(let k=0; k<5; k++) particles.push({x:inv.x, y:inv.y, vx:Math.random()-0.5, vy:Math.random()-0.5, life:20});
          if(Math.random() < 0.1) powerup = {x:inv.x, y:inv.y};
          playSound(400, 'sawtooth', 0.1);
        }
      });
      if(ufo && b.x > ufo.x && b.x < ufo.x+30 && b.y > ufo.y && b.y < ufo.y+20) { ufo = null; score += 100; playSound(800, 'sine', 0.2); }
    });
    // 敵弾
    enemyBullets.forEach((eb, i) => {
      eb.y += 2;
      if(eb.x > player.x && eb.x < player.x+30 && eb.y > player.y && eb.y < player.y+20) gameOver = true;
    });
    // 処理
    if(powerup) { powerup.y += 2; if(powerup.x > player.x && powerup.x < player.x+30 && powerup.y > player.y) { player.mode = 'wide'; powerup = null; } }
    particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life--; if(p.life < 0) particles.splice(i,1); });
    document.getElementById('score').textContent = score;
    if(invaders.every(inv => !inv.alive)) { stage++; initLevel(); }
    document.getElementById('stage').textContent = stage;
  }

  function draw() {
    ctx.clearRect(0,0,400,400);
    stars.forEach(st => { ctx.fillStyle="#fff"; ctx.fillRect(st.x, st.y, st.s, st.s); });
    ctx.fillStyle="#0f0"; ctx.fillRect(player.x, player.y, 30, 20);
    invaders.forEach(inv => { if(inv.alive) ctx.fillText(inv.type==='tako'?'🐙':inv.type==='ari'?'🐜':'🏍️', inv.x, inv.y+20); });
    bullets.forEach(b => { ctx.fillStyle="#ff0"; ctx.fillRect(b.x, b.y, 4, 10); });
    particles.forEach(p => { ctx.fillStyle="orange"; ctx.fillRect(p.x, p.y, 3, 3); });
    if(ufo) ctx.fillText('🛸', ufo.x, ufo.y+20);
    if(powerup) ctx.fillText('⚡', powerup.x, powerup.y+20);
    enemyBullets.forEach(eb => { ctx.fillStyle="#f00"; ctx.fillRect(eb.x, eb.y, 4, 4); });
    if(gameOver) { ctx.fillStyle="red"; ctx.font="40px Arial"; ctx.fillText("GAME OVER", 80, 200); }
  }

  initLevel();
  setInterval(() => { update(); draw(); }, 30);
  window.addEventListener('keydown', (e) => { if(e.key===' ') fire(); if(e.key==='ArrowLeft') move(-20); if(e.key==='ArrowRight') move(20); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 シューティングゲーム🛵 SPACE HONGDARS 🏍️</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    h1 { margin-top: 15px; font-size: 1.4rem; color: #00ff00; margin-bottom: 5px; }
    
    .status-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    #stage-board { color: #00ffff; }
    #score-board { color: #ffffff; }
    #ammo-board { color: #ff9900; }

    #gameCanvas {
      background: #000;
      border: 4px solid #333;
      display: block;
      margin: 0 auto;
      max-width: 100%;
    }

    /* ゲーム画面の外に配置する説明文 */
    .game-instructions {
      max-width: 400px;
      margin: 12px auto 0 auto;
      text-align: left;
      background: #222;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #ccc;
    }
    .game-instructions p { margin: 4px 0; }
    .highlight-text { color: #00ff00; font-weight: bold; }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    .btn {
      width: 70px;
      height: 60px;
      background: #333;
      border: 2px solid #555;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      touch-action: manipulation;
    }
    .btn:active { background: #555; }
    #btn-fire { background: #cc0000; border-color: #ff3333; width: 100px; }
    #btn-fire:active { background: #ff0000; }
    .info { color: #888; font-size: 0.85rem; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- タイトル修正 -->
  <h1>🚀 シューティングゲーム🛵 SPACE HONGDARS 🏍️</h1>
  
  <div class="status-container">
    <div id="stage-board">STAGE: <span id="stage">1</span></div>
    <div id="score-board">SCORE: <span id="score">0</span></div>
    <div id="ammo-board">残り手数: <span id="ammo">100</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <!-- 外側に出した説明文 -->
  <div class="game-instructions">
    <p><span class="highlight-text">【作戦指令】</span> 迫り来る 🐙 🐜 🏍️ を全滅させよ！</p>
    <p><span class="highlight-text">【獲得得点】</span> 🐙 : 30pts / 🐜 : 20pts / 🏍️ : 10pts / 🛸 : 100pts</p>
    <p><span class="highlight-text">【特殊補給】</span> 敵を倒すと稀に出現する ⚡ を取ると3連射に強化！</p>
  </div>

  <div class="controls">
    <button class="btn" id="btn-left">◀</button>
    <button class="btn" id="btn-fire">FIRE</button>
    <button class="btn" id="btn-right">▶</button>
  </div>

  <p class="info">PC操作: 左右矢印キー [←][→] で移動 / [スペースキー] で攻撃</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const ammoEl = document.getElementById("ammo");
    const stageEl = document.getElementById("stage");
    
    // サウンド用
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    let score = 0;
    let ammo = 100; 
    let stage = 1;
    let gameOver = false;
    let gameClear = false;

    const player = { x: 180, y: 360, width: 30, height: 20, speed: 6, mode: 'single' };
    let bullets = [];
    let invaders = [];
    let particles = [];
    let stars = [];
    let enemyBullets = [];
    let ufo = null;
    let powerup = null;

    // 敵の移動速度と向きの管理
    let invaderDirection = 1;
    let baseSpeed = 0.6;

    // 効果音再生
    function playSound(freq, type, dur) {
      try {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    // ステージ初期化
    function initLevel() {
      invaders = [];
      bullets = [];
      enemyBullets = [];
      ufo = null;
      powerup = null;
      invaderDirection = 1;

      // 元のサイズ感（横30px, 縦25px）で配置
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 6; c++) {
          let type = "bike";
          if (r === 0) type = "tako";
          if (r === 1) type = "ari";

          invaders.push({
            x: 40 + c * 50,
            y: 40 + r * 40,
            width: 30,
            height: 25,
            type: type,
            alive: true
          });
        }
      }
    }

    // 背景の星を生成
    for(let i=0; i<40; i++) {
      stars.push({ x: Math.random()*400, y: Math.random()*400, speed: Math.random()*1.5 + 0.5 });
    }

    let rightPressed = false;
    let leftPressed = false;

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") rightPressed = true;
      if (e.key === "ArrowLeft") leftPressed = true;
      if (e.key === " " || e.key === "Spacebar") {
        fireBullet();
        e.preventDefault();
      }
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowRight") rightPressed = false;
      if (e.key === "ArrowLeft") leftPressed = false;
    });

    document.getElementById("btn-left").addEventListener("pointerdown", () => leftPressed = true);
    document.getElementById("btn-left").addEventListener("pointerup", () => leftPressed = false);
    document.getElementById("btn-right").addEventListener("pointerdown", () => rightPressed = true);
    document.getElementById("btn-right").addEventListener("pointerup", () => rightPressed = false);
    document.getElementById("btn-fire").addEventListener("pointerdown", fireBullet);

    function fireBullet() {
      if (gameOver || gameClear) return;
      if (ammo <= 0) return;

      if (bullets.length < 4) {
        if (player.mode === 'wide') {
          // 3方向ショット
          bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 7, vx: -2 });
          bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 7, vx: 0 });
          bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 7, vx: 2 });
        } else {
          // 通常ショット
          bullets.push({ x: player.x + player.width/2 - 2, y: player.y, width: 4, height: 10, speed: 7, vx: 0 });
        }
        
        ammo--; 
        ammoEl.textContent = ammo;
        playSound(300, 'square', 0.08);

        if (ammo <= 0 && bullets.length === 0) {
          gameOver = true;
        }
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      update();
      draw();

      if (!gameOver && !gameClear) {
        requestAnimationFrame(gameLoop);
      } else if (gameClear) {
        ctx.fillStyle = "#00ff00";
        ctx.font = "30px sans-serif";
        ctx.fillText("ALL STAGE CLEAR!", 60, 200);
      } else {
        ctx.fillStyle = "red";
        ctx.font = "30px sans-serif";
        ctx.fillText("GAME OVER", 110, 200);
        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText("リロードして再挑戦", 135, 240);
      }
    }

    function update() {
      if (gameOver || gameClear) return;

      // 星のスクロール
      stars.forEach(st => {
        st.y += st.speed;
        if(st.y > 400) st.y = 0;
      });

      // ボーナスUFOの出現と移動
      if(!ufo && Math.random() < 0.003) {
        ufo = { x: -30, y: 15, width: 30, height: 20, speed: 1.5 };
      }
      if(ufo) {
        ufo.x += ufo.speed;
        if(ufo.x > 410) ufo = null;
      }

      // プレイヤー移動
      if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;
      if (leftPressed && player.x > 0) player.x -= player.speed;

      // 自機弾の移動
      bullets.forEach((b, index) => {
        b.y -= b.speed;
        b.x += b.vx;
        if (b.y < 0 || b.x < 0 || b.x > 400) {
          bullets.splice(index, 1);
        }
      });

      // 敵の横移動と「1段下がる」判定
      let shiftDown = false;
      let currentSpeed = (baseSpeed + (stage - 1) * 0.2) * invaderDirection;

      invaders.forEach(inv => {
        if (!inv.alive) return;
        inv.x += currentSpeed;
        
        // 画面端にぶつかったら折り返しフラグ
        if (inv.x > canvas.width - inv.width || inv.x < 0) {
          shiftDown = true;
        }
        // 自機の位置まで侵略されたらアウト
        if (inv.y + inv.height >= player.y) {
          gameOver = true;
        }
      });

      // 端に当たったら反転して1段（15px）下ろす
      if (shiftDown) {
        invaderDirection *= -1;
        invaders.forEach(inv => {
          if (inv.alive) inv.y += 15;
        });
      }

      // 敵の反撃弾（ステージが進むほど高確率）
      invaders.forEach(inv => {
        if (inv.alive && Math.random() < 0.0005 * stage) {
          enemyBullets.push({ x: inv.x + inv.width/2, y: inv.y + inv.height, speed: 3 });
        }
      });

      // 敵弾の移動
      enemyBullets.forEach((eb, index) => {
        eb.y += eb.speed;
        if (eb.y > 400) enemyBullets.splice(index, 1);

        // プレイヤーへの当たり判定
        if (eb.x > player.x && eb.x < player.x + player.width && eb.y > player.y && eb.y < player.y + player.height) {
          gameOver = true;
          playSound(150, 'sawtooth', 0.5);
        }
      });

      // パワーアップアイテムの移動と取得
      if(powerup) {
        powerup.y += 1.5;
        if(powerup.y > 400) powerup = null;
        else if(powerup.x > player.x && powerup.x < player.x + player.width && powerup.y > player.y && powerup.y < player.y + player.height) {
          player.mode = 'wide'; // 3連射化
          powerup = null;
          playSound(600, 'sine', 0.15);
        }
      }

      // パーティクルの寿命処理
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if(p.life <= 0) particles.splice(index, 1);
      });

      // 命中判定（自機弾 vs 敵・UFO）
      bullets.forEach((b, bIdx) => {
        // 対インベーダー
        invaders.forEach((inv) => {
          if (inv.alive && b.x > inv.x && b.x < inv.x + inv.width && b.y > inv.y && b.y < inv.y + inv.height) {
            inv.alive = false;
            bullets.splice(bIdx, 1);
            
            // スコア配点
            if (inv.type === "tako") score += 30;
            else if (inv.type === "ari") score += 20;
            else score += 10;
            
            scoreEl.textContent = score;
            playSound(150, 'sawtooth', 0.05);

            // 爆発火花を散らす
            for(let k=0; k<6; k++) {
              particles.push({
                x: inv.x + inv.width/2,
                y: inv.y + inv.height/2,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4,
                life: 15
              });
            }

            // 10%の確率でパワーアップアイテム（⚡）を落とす
            if(Math.random() < 0.12 && !powerup) {
              powerup = { x: inv.x + inv.width/2, y: inv.y };
            }
            
            // ステージクリア判定
            if (invaders.every(i => !i.alive)) {
              stage++;
              if(stage > 4) { // 簡易的にステージ4で全面クリア
                gameClear = true;
              } else {
                stageEl.textContent = stage;
                initLevel();
              }
            }
          }
        });

        // 対UFO
        if (ufo && b.x > ufo.x && b.x < ufo.x + ufo.width && b.y > ufo.y && b.y < ufo.y + ufo.height) {
          ufo = null;
          bullets.splice(bIdx, 1);
          score += 100;
          scoreEl.textContent = score;
          playSound(500, 'sine', 0.2);
          for(let k=0; k<10; k++) {
            particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 20 });
          }
        }
      });

      // 弾切れゲームオーバーチェック
      if (ammo <= 0 && bullets.length === 0 && !gameClear) {
        gameOver = true;
      }
    }

    function draw() {
      // 背景の星を描画
      ctx.fillStyle = "#ffffff";
      stars.forEach(st => {
        ctx.fillRect(st.x, st.y, st.speed * 0.8, st.speed * 0.8);
      });

      // プレイヤー（緑）
      ctx.fillStyle = "#00ff00";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // 自機弾（黄）
      ctx.fillStyle = "#ffff00";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      // 敵弾（赤）
      ctx.fillStyle = "#ff3333";
      enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.width, eb.height));

      // 爆発パーティクル（オレンジ）
      ctx.fillStyle = "#ff9900";
      particles.forEach(p => ctx.fillRect(p.x, p.y, 2, 2));

      // パワーアップアイテム（⚡）
      if(powerup) {
        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚡", powerup.x, powerup.y);
      }

      // ボーナスUFO（🛸）
      if(ufo) {
        ctx.font = "24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🛸", ufo.x + ufo.width/2, ufo.y);
      }

      // 敵キャラクター（元のサイズ 24px でしっかり描画）
      invaders.forEach(inv => {
        if (inv.alive) {
          ctx.font = "24px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          
          if (inv.type === "tako") {
            ctx.fillText("🐙", inv.x + inv.width / 2, inv.y);
          } else if (inv.type === "ari") {
            ctx.fillText("🐜", inv.x + inv.width / 2, inv.y);
          } else {
            ctx.fillText("🏍️", inv.x + inv.width / 2, inv.y);
          }
        }
      });
    }

    // 初回スタート
    initLevel();
    gameLoop();
  </script>
</body>
</html>

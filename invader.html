<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 シューティングゲーム🛵 SPACE HONGDARS 🏍️</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    h1 { margin-top: 20px; font-size: 1.4rem; color: #00ff00; }
    #score-board { font-size: 1.2rem; margin-bottom: 10px; }
    #gameCanvas {
      background: #000;
      border: 4px solid #333;
      display: block;
      margin: 0 auto;
      max-width: 100%;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
    }
    .btn {
      width: 70px;
      height: 60px;
      background: #333;
      border: 2px solid #555;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      user-select: none;
      touch-action: manipulation;
    }
    .btn:active { background: #555; }
    #btn-fire { background: #cc0000; border-color: #ff3333; width: 100px; }
    #btn-fire:active { background: #ff0000; }
    .info { color: #888; font-size: 0.85rem; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>🚀 シューティングゲーム🛵 SPACE HONGDARS 🏍️</h1>
  <div id="score-board">SCORE: <span id="score">0</span></div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="controls">
    <button class="btn" id="btn-left">◀</button>
    <button class="btn" id="btn-fire">FIRE</button>
    <button class="btn" id="btn-right">▶</button>
  </div>

  <p class="info">PC操作: 左右矢印キー [←][→] で移動 / [スペースキー] で攻撃</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");

    let score = 0;
    let gameOver = false;

    // 自機（プレイヤーの緑のロケット）
    const player = { x: 180, y: 360, width: 30, height: 20, speed: 5 };
    let bullets = [];
    let invaders = [];

    const rows = 3;
    const cols = 6;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        let type = "bike"; // 3段目はバイク（デフォルト）
        if (r === 0) type = "tako"; // 1段目はタコ
        if (r === 1) type = "ari";  // 2段目はアリ

        invaders.push({
          x: 40 + c * 50,
          y: 40 + r * 40,
          width: 30,
          height: 25,
          type: type,
          alive: true
        });
      }
    }

    let invaderSpeed = 0.6;
    let invaderDirection = 1;

    let rightPressed = false;
    let leftPressed = false;

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") rightPressed = true;
      if (e.key === "ArrowLeft") leftPressed = true;
      if (e.key === " " || e.key === "Spacebar") {
        fireBullet();
        e.preventDefault();
      }
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowRight") rightPressed = false;
      if (e.key === "ArrowLeft") leftPressed = false;
    });

    document.getElementById("btn-left").addEventListener("pointerdown", () => leftPressed = true);
    document.getElementById("btn-left").addEventListener("pointerup", () => leftPressed = false);
    document.getElementById("btn-right").addEventListener("pointerdown", () => rightPressed = true);
    document.getElementById("btn-right").addEventListener("pointerup", () => rightPressed = false);
    document.getElementById("btn-fire").addEventListener("pointerdown", fireBullet);

    function fireBullet() {
      if (gameOver) return;
      if (bullets.length < 3) {
        bullets.push({ x: player.x + player.width / 2 - 2, y: player.y, width: 4, height: 10, speed: 7 });
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      } else {
        ctx.fillStyle = "red";
        ctx.font = "30px sans-serif";
        ctx.fillText("GAME OVER", 110, 200);
        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText("リロードして再挑戦", 140, 240);
      }
    }

    function update() {
      if (rightPressed && player.x < canvas.width - player.width) player.x += player.speed;
      if (leftPressed && player.x > 0) player.x -= player.speed;

      bullets.forEach((b, index) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(index, 1);
      });

      let shiftDown = false;
      invaders.forEach(inv => {
        if (!inv.alive) return;
        inv.x += invaderSpeed * invaderDirection;
        if (inv.x > canvas.width - inv.width || inv.x < 0) {
          shiftDown = true;
        }
        if (inv.y + inv.height >= player.y) {
          gameOver = true;
        }
      });

      if (shiftDown) {
        invaderDirection *= -1;
        invaders.forEach(inv => { if (inv.alive) inv.y += 15; });
      }

      bullets.forEach((b, bIdx) => {
        invaders.forEach((inv) => {
          if (inv.alive && b.x > inv.x && b.x < inv.x + inv.width && b.y > inv.y && b.y < inv.y + inv.height) {
            inv.alive = false;
            bullets.splice(bIdx, 1);
            
            if (inv.type === "tako") score += 30;
            else if (inv.type === "ari") score += 20;
            else score += 10; // バイク（旧インベーダー）は10点
            
            scoreEl.textContent = score;
            
            if (invaders.every(i => !i.alive)) {
              gameOver = true;
            }
          }
        });
      });
    }

    function draw() {
      // プレイヤー（緑）
      ctx.fillStyle = "#00ff00";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // 弾（黄）
      ctx.fillStyle = "#ffff00";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      // 敵キャラクターの描画
      invaders.forEach(inv => {
        if (inv.alive) {
          ctx.font = "20px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          
          if (inv.type === "tako") {
            ctx.fillText("🐙", inv.x + inv.width / 2, inv.y);
          } else if (inv.type === "ari") {
            ctx.fillText("🐜", inv.x + inv.width / 2, inv.y);
          } else {
            ctx.fillText("🏍️", inv.x + inv.width / 2, inv.y); // 👾を🏍️に変更
          }
        }
      });
    }

    gameLoop();
  </script>
</body>
</html>
